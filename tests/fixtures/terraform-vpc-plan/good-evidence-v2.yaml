applyAllowed: false
boundary: Sanitized speculative-plan evidence only. It retains approved
  non-secret VPC observations, identities, outcomes, actions, counts, and hashes.
  Credentials, environment variables, generic/raw resource values, raw plan
  JSON, binary plans, and Terraform state are excluded.
