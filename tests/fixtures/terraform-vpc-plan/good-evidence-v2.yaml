guidance:
  - Fix the source requirement and recompile when an input is wrong.
  - Select credentials for the intended AWS account when identity does not
    match.
  - Correct the code-owned approved adapter when tool or schema validation
    fails.
  - Seek owner review when destructive intent cannot be removed from the design.
