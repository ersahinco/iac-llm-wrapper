[project]
name = "iac-llm-wrapper"
version = "0.1.0"
description = "Intent-to-IaC orchestration framework. Extract intent, validate decisions, and emit traceable handoff artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Cemreoguz Ersahin", email = "ersahin@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "ruamel.yaml>=0.18",
    "networkx>=3.0",
    "requests>=2.28",
]

[project.urls]
homepage = "https://github.com/ersahinco/iac-llm-wrapper"
repository = "https://github.com/ersahinco/iac-llm-wrapper"
documentation = "https://github.com/ersahinco/iac-llm-wrapper#readme"

[project.scripts]
iac-llm-wrapper = "intent_engine.cli:app"
intent-engine = "intent_engine.cli:app"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "pre-commit>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["UP006"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = [
    "scripts/evaluate-extraction.py",
    "scripts/evaluate-usability.py",
    "scripts/sync-sample-fixtures.py",
    "src/intent_engine",
]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
