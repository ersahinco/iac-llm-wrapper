[project]
name = "iac-llm-wrapper"
version = "0.1.0"
description = "Architect intent to registered target configuration. Extract decisions, validate readiness, and emit traceable handoff artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Cemreoguz Ersahin", email = "ersahin@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.13.4,<3",
    "typer>=0.27.0,<1",
    "ruamel.yaml>=0.19.1,<0.20",
    "requests>=2.34.2,<3",
]

[project.urls]
homepage = "https://github.com/ersahinco/iac-llm-wrapper"
repository = "https://github.com/ersahinco/iac-llm-wrapper"
documentation = "https://github.com/ersahinco/iac-llm-wrapper#readme"

[project.scripts]
iac-llm-wrapper = "intent_engine.cli:app"
intent-engine = "intent_engine.cli:app"

[project.optional-dependencies]
dev = [
    "build>=1.5.0,<2",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.21,<0.16",
    "mypy>=2.3.0,<3",
    "pyright>=1.1.411,<2",
    "pip-audit>=2.10.1,<3",
    "bandit>=1.9.4,<2",
    "prek>=0.4.10,<0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = "==0.11.29"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["C901", "E", "F", "I", "PLR0912", "PLR0915", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["UP006"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = [
    "scripts/battle-test.py",
    "scripts/compare-model-benchmarks.py",
    "scripts/evaluate-extraction.py",
    "scripts/evaluate-golden-journey.py",
    "scripts/evaluate-usability.py",
    "scripts/render-dev-views.py",
    "scripts/sync-sample-fixtures.py",
    "src/intent_engine",
]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
