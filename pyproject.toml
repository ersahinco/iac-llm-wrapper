[project]
name = "iac-llm-wrapper"
version = "0.1.0"
description = "Knowledge-driven infrastructure decision engine. Capture architectural intent, validate decisions, and produce traceable artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Cemreoguz Ersahin", email = "ersahin@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "ruamel.yaml>=0.18",
    "networkx>=3.0",
    "requests>=2.28",
]

[project.urls]
homepage = "https://github.com/ersahinco/iac-llm-wrapper"
repository = "https://github.com/ersahinco/iac-llm-wrapper"
documentation = "https://github.com/ersahinco/iac-llm-wrapper#readme"

[project.scripts]
iac-llm-wrapper = "intent_engine.cli:app"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "pre-commit>=3.0",
]
llm = [
    "openai>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["UP006"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = [
    "scripts/benchmark-extraction.py",
    "src/intent_engine/cli.py",
    "src/intent_engine/core/catalog.py",
    "src/intent_engine/core/patterns.py",
    "src/intent_engine/core/requirements.py",
    "src/intent_engine/core/contracts.py",
    "src/intent_engine/core/discovery.py",
    "src/intent_engine/core/interview.py",
    "src/intent_engine/core/normalizer.py",
    "src/intent_engine/core/llm_caller.py",
    "src/intent_engine/core/suggestion.py",
    "src/intent_engine/core/extractor.py",
    "src/intent_engine/core/compiler.py",
    "src/intent_engine/core/generator.py",
    "src/intent_engine/core/markdown_extractor.py",
    "src/intent_engine/core/module_mapping.py",
    "src/intent_engine/core/sample_config.py",
    "src/intent_engine/core/validator.py",
    "src/intent_engine/core/model_introspection.py",
    "src/intent_engine/patterns/aws_lza/__init__.py",
    "src/intent_engine/patterns/aws_lza/contracts.py",
    "src/intent_engine/patterns/aws_lza/models.py",
    "src/intent_engine/patterns/kubernetes/__init__.py",
    "src/intent_engine/patterns/lza/generators.py",
]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
