pattern: kubernetes-cluster
clusterName: prod-k8s
clusterVersion: '1.30'
network:
  podCidr: 10.244.0.0/16
  serviceCidr: 10.96.0.0/12
  networkPolicyEnabled: true
nodePool:
  name: primary
  instanceType: t3.large
  minSize: 2
  maxSize: 5
namespace: production
handoffReadiness: &id001
  handoffAllowed: true
  deploymentAllowed: true
  status: ready
  summary: Ready for handoff.
  blockers: []
  missingDecisions: []
  conflictingDecisions: []
  safeHandoffPath:
    - Review handoff-plan.yaml for owners, manual gates, and allowed next
      action.
    - Validate target contracts and artifact owner approvals before downstream
      use.
    - Pass only reviewed artifacts to the existing accelerator/module toolchain.
deploymentReadiness: *id001
