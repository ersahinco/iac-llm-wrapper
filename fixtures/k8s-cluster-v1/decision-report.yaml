pattern: kubernetes-cluster
clusterName: prod-k8s
clusterVersion: '1.30'
network:
  podCidr: 10.244.0.0/16
  serviceCidr: 10.96.0.0/12
  networkPolicyEnabled: true
nodePool:
  name: primary
  instanceType: t3.large
  minSize: 2
  maxSize: 5
namespace: production
handoffReadiness: &id002
  handoffAllowed: true
  deploymentAllowed: true
  status: ready
  allowedNextAction: Pass the reviewed artifacts to the existing target
    toolchain after manual gates.
  summary: Ready for handoff.
  configReady:
    status: ready
    allowed: true
    summary: Validated target configuration artifacts are ready for owner
      review.
    blockers: &id001 []
  planReady:
    status: not-declared
    planAllowed: false
    summary: No registered plan-ready bundle is declared for this target.
    blockers: []
  blockers: *id001
  missingDecisions: []
  conflictingDecisions: []
  safeHandoffPath:
    - Review handoff-plan.yaml for owners, manual gates, and allowed next
      action.
    - Validate target contracts and artifact owner approvals before downstream
      use.
    - Pass only reviewed artifacts to the existing target toolchain.
deploymentReadiness: *id002
