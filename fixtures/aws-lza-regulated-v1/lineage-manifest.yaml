# yaml-language-server: $schema=none
# Generated by intent-engine — AWS LZA handoff artifact.
sourceContract:
  name: aws-lza-sample-configuration
  kind: aws-lza-sample-configuration
  url:
    https://awslabs.github.io/landing-zone-accelerator-on-aws/latest/sample-configurations/
  baseline: standard
  mandatoryConfigFiles:
    - accounts-config.yaml
    - global-config.yaml
    - iam-config.yaml
    - network-config.yaml
    - organization-config.yaml
    - security-config.yaml
artifacts:
  - name: accounts-config.yaml
    required: true
    description: AWS accounts and account vending inputs.
    requiredPaths:
      - mandatoryAccounts[]
      - mandatoryAccounts[].name
      - mandatoryAccounts[].email
      - workloadAccounts[]
      - workloadAccounts[].name
      - workloadAccounts[].email
    valueAssertions: []
  - name: global-config.yaml
    required: true
    description: Global regions, logging, tags, and inherited properties.
    requiredPaths:
      - homeRegion
      - enabledRegions
      - managementAccountAccessRole
      - terminationProtection
      - cloudwatchLogRetentionInDays
      - cdkOptions.centralizeBuckets
      - cdkOptions.useManagementAccessRole
      - controlTower.enable
      - snsTopics
      - tags
      - logging.account
      - logging.centralizedLoggingRegion
      - logging.cloudtrail.enable
      - logging.cloudtrail.organizationTrail
      - logging.sessionManager.sendToCloudWatchLogs
      - logging.sessionManager.sendToS3
      - logging.centralLogBucket.lifecycleRules
      - logging.accessLogBucket.lifecycleRules
    valueAssertions:
      - path: terminationProtection
        equals: true
        oneOf: []
      - path: cdkOptions.centralizeBuckets
        equals: true
        oneOf: []
      - path: cdkOptions.useManagementAccessRole
        equals: true
        oneOf: []
      - path: logging.cloudtrail.organizationTrail
        equals: true
        oneOf: []
      - path: logging.sessionManager.sendToCloudWatchLogs
        equals: true
        oneOf: []
      - path: logging.sessionManager.sendToS3
        equals: true
        oneOf: []
  - name: iam-config.yaml
    required: true
    description: IAM and IAM Identity Center resources.
    requiredPaths:
      - homeRegion
      - identityCenter.name
      - identityCenter.delegatedAdminAccount
      - identityCenter.identityCenterPermissionSets[]
      - identityCenter.identityCenterPermissionSets[].name
      - identityCenter.identityCenterPermissionSets[].sessionDuration
      - identityCenter.identityCenterAssignments[]
      - identityCenter.identityCenterAssignments[].principalType
      - identityCenter.identityCenterAssignments[].principalId
      - identityCenter.identityCenterAssignments[].permissionSetName
      - identityCenter.identityCenterAssignments[].deploymentTargets
    valueAssertions: []
  - name: network-config.yaml
    required: true
    description: Network resources and connectivity architecture.
    requiredPaths:
      - homeRegion
      - defaultVpc.delete
      - defaultVpc.excludeAccounts
      - endpointPolicies
      - transitGateways
      - vpcs[]
      - vpcs[].name
      - vpcs[].account
      - vpcs[].region
      - vpcs[].cidrs[]
      - vpcs[].enableDnsHostnames
      - vpcs[].enableDnsSupport
      - vpcs[].instanceTenancy
      - vpcs[].routeTables
      - vpcs[].subnets
      - vpcs[].natGateways
      - vpcs[].transitGatewayAttachments
      - vpcs[].tags
    valueAssertions:
      - path: defaultVpc.delete
        equals: true
        oneOf: []
      - path: vpcs[].enableDnsHostnames
        equals: true
        oneOf: []
      - path: vpcs[].enableDnsSupport
        equals: true
        oneOf: []
      - path: vpcs[].instanceTenancy
        equals: default
        oneOf: []
  - name: organization-config.yaml
    required: true
    description: Organizational units and AWS Organizations policies.
    requiredPaths:
      - enable
      - organizationalUnits
      - organizationalUnits[]
      - organizationalUnits[].name
      - serviceControlPolicies
      - taggingPolicies
      - backupPolicies
    valueAssertions:
      - path: enable
        equals: true
        oneOf: []
  - name: security-config.yaml
    required: true
    description: AWS security service configuration.
    requiredPaths:
      - accessAnalyzer.enable
      - iamPasswordPolicy.allowUsersToChangePassword
      - awsConfig.enableConfigurationRecorder
      - cloudWatch.metricSets
      - cloudWatch.alarmSets
      - centralSecurityServices.delegatedAdminAccount
      - centralSecurityServices.ebsDefaultVolumeEncryption.enable
      - centralSecurityServices.ebsDefaultVolumeEncryption.excludeRegions
      - centralSecurityServices.s3PublicAccessBlock.enable
      - centralSecurityServices.s3PublicAccessBlock.excludeAccounts
      - centralSecurityServices.scpRevertChangesConfig.enable
      - centralSecurityServices.scpRevertChangesConfig.snsTopicName
      - centralSecurityServices.macie.enable
      - centralSecurityServices.macie.excludeRegions
      - centralSecurityServices.macie.policyFindingsPublishingFrequency
      - centralSecurityServices.macie.publishSensitiveDataFindings
      - centralSecurityServices.guardduty.enable
      - centralSecurityServices.guardduty.autoEnableOrgMembers
      - centralSecurityServices.guardduty.excludeRegions
      - centralSecurityServices.guardduty.s3Protection.enable
      - centralSecurityServices.guardduty.s3Protection.excludeRegions
      - centralSecurityServices.guardduty.eksProtection.enable
      - centralSecurityServices.guardduty.eksProtection.excludeRegions
      - centralSecurityServices.guardduty.exportConfiguration.enable
      - centralSecurityServices.guardduty.exportConfiguration.overrideExisting
      - centralSecurityServices.guardduty.exportConfiguration.destinationType
      - centralSecurityServices.guardduty.exportConfiguration.exportFrequency
      - centralSecurityServices.guardduty.lifecycleRules
      - centralSecurityServices.snsSubscriptions
      - centralSecurityServices.securityHub.enable
      - centralSecurityServices.securityHub.autoEnableOrgMembers
      - centralSecurityServices.securityHub.regionAggregation
      - centralSecurityServices.securityHub.snsTopicName
      - centralSecurityServices.securityHub.notificationLevel
      - centralSecurityServices.securityHub.excludeRegions
      - centralSecurityServices.securityHub.standards[]
      - centralSecurityServices.securityHub.standards[].name
      - centralSecurityServices.securityHub.standards[].deploymentTargets.organizationalUnits[]
      - centralSecurityServices.securityHub.standards[].controlsToDisable
      - centralSecurityServices.ssmAutomation.excludeRegions
      - centralSecurityServices.ssmAutomation.documentSets
    valueAssertions:
      - path: centralSecurityServices.ebsDefaultVolumeEncryption.enable
        equals: true
        oneOf: []
      - path: centralSecurityServices.s3PublicAccessBlock.enable
        equals: true
        oneOf: []
      - path: centralSecurityServices.scpRevertChangesConfig.enable
        equals: true
        oneOf: []
      - path: centralSecurityServices.scpRevertChangesConfig.snsTopicName
        equals: Security
        oneOf: []
      - path: centralSecurityServices.macie.policyFindingsPublishingFrequency
        equals: FIFTEEN_MINUTES
        oneOf: []
      - path: centralSecurityServices.guardduty.autoEnableOrgMembers
        equals: true
        oneOf: []
      - path: centralSecurityServices.guardduty.eksProtection.enable
        equals: true
        oneOf: []
      - path:
          centralSecurityServices.guardduty.exportConfiguration.overrideExisting
        equals: true
        oneOf: []
      - path:
          centralSecurityServices.guardduty.exportConfiguration.destinationType
        equals: S3
        oneOf: []
      - path:
          centralSecurityServices.guardduty.exportConfiguration.exportFrequency
        equals: FIFTEEN_MINUTES
        oneOf: []
      - path: centralSecurityServices.securityHub.autoEnableOrgMembers
        equals: true
        oneOf: []
      - path: centralSecurityServices.securityHub.regionAggregation
        equals: true
        oneOf: []
      - path: centralSecurityServices.securityHub.snsTopicName
        equals: Security
        oneOf: []
      - path: centralSecurityServices.securityHub.notificationLevel
        equals: HIGH
        oneOf: []
  - name: decision-report.yaml
    required: true
    description: Accepted AWS LZA decisions and readiness.
    requiredPaths:
      - pattern
      - baseline
      - orgMode
      - organizationName
      - homeRegion
      - enabledRegions[]
      - organizationalUnits[]
      - accounts.audit
      - accounts.logArchive
      - accounts.securityTooling
      - identity.identityCenterDelegatedAdmin
      - identity.identityCenterPermissionSets[]
      - identity.identityCenterAssignments[]
      - network.topology
      - network.cidr
      - security.centralizedLogging
      - security.securityHubEnabled
      - security.guardDutyEnabled
      - security.complianceOverlay
    valueAssertions:
      - path: pattern
        equals: aws-lza
        oneOf: []
  - name: lineage-manifest.yaml
    required: true
    description: Decision-to-artifact lineage for AWS LZA handoff files.
    requiredPaths:
      - sourceContract.name
      - sourceContract.kind
      - sourceContract.url
      - sourceContract.mandatoryConfigFiles[]
      - artifacts[]
      - artifacts[].name
      - lineage[]
      - lineage[].decision
      - lineage[].artifact
      - lineage[].path
    valueAssertions:
      - path: sourceContract.name
        equals: aws-lza-sample-configuration
        oneOf: []
  - name: deployment-runbook.md
    required: true
    description: Human review runbook for AWS LZA handoff sequencing.
    requiredPaths: []
    valueAssertions: []
lineage:
  - decision: org_mode
    artifact: global-config.yaml
    path: controlTower.enable
  - decision: home_region
    artifact: global-config.yaml
    path: homeRegion
  - decision: enabled_regions
    artifact: global-config.yaml
    path: enabledRegions
  - decision: workload_accounts
    artifact: accounts-config.yaml
    path: workloadAccounts[]
  - decision: identity_center_delegated_admin_account
    artifact: iam-config.yaml
    path: identityCenter.delegatedAdminAccount
  - decision: identity_center_permission_sets
    artifact: iam-config.yaml
    path: identityCenter.identityCenterPermissionSets[]
  - decision: identity_center_assignments
    artifact: iam-config.yaml
    path: identityCenter.identityCenterAssignments[]
  - decision: log_archive_account
    artifact: global-config.yaml
    path: logging.account
  - decision: network_cidr
    artifact: network-config.yaml
    path: vpcs[].cidrs[]
  - decision: security_tooling_account
    artifact: security-config.yaml
    path: centralSecurityServices.delegatedAdminAccount
  - decision: centralized_logging
    artifact: global-config.yaml
    path: logging.cloudtrail.enable
  - decision: security_hub_enabled
    artifact: security-config.yaml
    path: centralSecurityServices.securityHub.enable
  - decision: guardduty_enabled
    artifact: security-config.yaml
    path: centralSecurityServices.guardduty.enable
  - decision: compliance_overlay
    artifact: security-config.yaml
    path: centralSecurityServices.securityHub.standards[]
