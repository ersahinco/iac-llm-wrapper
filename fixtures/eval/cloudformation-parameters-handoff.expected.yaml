version: 1
name: cloudformation-parameters-handoff
input: cloudformation-parameters-handoff.md
pattern: cloudformation-parameters
expect:
  compile: pass
  values:
    stack.name: orders-service-prod
    stack.templateUrl: s3://approved-templates/orders-service.yaml
    stack.region: eu-central-1
    boundary: Parameter handoff for an existing CloudFormation template; no stack is generated.
  artifacts:
    - cloudformation-parameters.yaml
    - decision-report.yaml
    - handoff-plan.yaml
    - llm-trace-summary.yaml
    - model-benchmark.yaml
  forbiddenArtifacts:
    - main.tf
    - terraform.tfvars
    - template.yaml
    - stack.yaml
  trace:
    required:
      - rawLlmDecisions
      - acceptedDecisions
      - appliedDecisions.markdown
      - gaps.resolved
      - gaps.blocking
      - rawEvidence.status
    absent:
      - extractedDecisions
      - rawEvidencePath
    values:
      pattern: cloudformation-parameters
      deploymentReadiness.status: ready
    deterministicValues:
      callCount: 0
      rawEvidence.status: not-requested
    llmValues:
      callCount: 1
      rawEvidence.status: requested
