version: 1
name: aws-lza-standard-handoff
input: aws-lza-standard-handoff.md
pattern: aws-lza
expect:
  compile: pass
  values:
    pattern: aws-lza
    baseline: standard
    orgMode: control-tower
    organizationName: ExampleCorp
    homeRegion: eu-central-1
    network.topology: hub-spoke
    network.cidr: 10.50.0.0/16
    security.centralizedLogging: true
    security.securityHubEnabled: true
    security.guardDutyEnabled: true
    security.complianceOverlay: none
    handoffReadiness.status: ready
    handoffReadiness.handoffAllowed: true
  counts:
    enabledRegions: 1
    organizationalUnits: 3
  names:
    enabledRegions:
      - eu-central-1
    organizationalUnits:
      - Security
      - Infrastructure
      - Workloads
  artifacts:
    - accounts-config.yaml
    - global-config.yaml
    - iam-config.yaml
    - network-config.yaml
    - organization-config.yaml
    - security-config.yaml
    - decision-report.yaml
    - handoff-plan.yaml
    - llm-trace-summary.yaml
    - model-benchmark.yaml
    - lineage-manifest.yaml
    - deployment-runbook.md
    - sample-recommendations.yaml
  forbiddenArtifacts:
    - main.tf
    - terraform.tfvars
    - terragrunt.hcl
    - template.yaml
    - stack.yaml
  trace:
    required:
      - rawLlmDecisions
      - acceptedDecisions
      - appliedDecisions.markdown
      - gaps.resolved
      - gaps.blocking
      - rawEvidence.status
    absent:
      - extractedDecisions
      - rawEvidencePath
    values:
      pattern: aws-lza
      handoffReadiness.status: ready
    deterministicValues:
      callCount: 0
      rawEvidence.status: not-requested
    llmValues:
      callCount: 1
      rawEvidence.status: requested
