version: 1
name: customer-packet-banking-lza
input: customer-packet-banking-lza.md
pattern: aws-lza
expect:
  compile: fail
  violations:
    - AWS_LZA_WORKLOAD_ACCOUNT_OU_AMBIGUOUS
  values:
    pattern: aws-lza
    handoffReadiness.status: blocked
    handoffReadiness.handoffAllowed: false
  artifacts:
    - decision-report.yaml
    - llm-trace-summary.yaml
    - model-benchmark.yaml
  forbiddenArtifacts:
    - accounts-config.yaml
    - global-config.yaml
    - iam-config.yaml
    - network-config.yaml
    - organization-config.yaml
    - security-config.yaml
    - handoff-plan.yaml
    - lineage-manifest.yaml
    - deployment-runbook.md
    - sample-recommendations.yaml
    - context-manifest.yaml
    - main.tf
    - terraform.tfvars
    - terragrunt.hcl
    - template.yaml
    - stack.yaml
  contracts:
    - blocked-assessment-artifacts
  trace:
    required:
      - rawLlmDecisions
      - acceptedDecisions
      - appliedDecisions.markdown
      - gaps.resolved
      - gaps.blocking
      - rawEvidence.status
    absent:
      - extractedDecisions
      - rawEvidencePath
    values:
      pattern: aws-lza
      handoffReadiness.status: blocked
    deterministicValues:
      callCount: 0
      rawEvidence.status: not-requested
    llmValues:
      callCount: 1
      rawEvidence.status: requested
