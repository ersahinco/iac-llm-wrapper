version: 1
name: terraform-vpc-customer-notes
input: terraform-vpc-customer-notes.md
pattern: terraform-vpc
expect:
  compile: pass
  values:
    vpc.name: payments-shared-vpc
    vpc.region: eu-west-1
    vpc.cidr: 10.90.0.0/16
    vpc.azCount: 3
    vpc.publicSubnetCidrs:
      - 10.90.0.0/24
      - 10.90.1.0/24
      - 10.90.2.0/24
    vpc.privateSubnetCidrs:
      - 10.90.10.0/24
      - 10.90.11.0/24
      - 10.90.12.0/24
    vpc.enableNatGateway: true
    vpc.singleNatGateway: false
    vpc.enableDnsHostnames: true
  artifacts:
    - decision-report.yaml
    - module-inputs.yaml
    - terraform.tfvars
    - handoff-plan.yaml
    - llm-trace-summary.yaml
    - model-benchmark.yaml
    - sample-recommendations.yaml
  forbiddenArtifacts:
    - main.tf
    - terragrunt.hcl
    - template.yaml
    - stack.yaml
  trace:
    required:
      - rawLlmDecisions
      - acceptedDecisions
      - appliedDecisions.markdown
      - gaps.resolved
      - gaps.blocking
      - rawEvidence.status
    absent:
      - extractedDecisions
      - rawEvidencePath
    values:
      pattern: terraform-vpc
      handoffReadiness.status: ready
      deploymentReadiness.status: ready
    deterministicValues:
      callCount: 0
      rawEvidence.status: not-requested
    llmValues:
      callCount: 1
      rawEvidence.status: requested
