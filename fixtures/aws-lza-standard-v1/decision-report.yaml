          decision: identity_center_assignments
          format: Principal:PermissionSet:Account
      status: pass
      evidence: PlatformAdmins:PowerUserAccess:Management
      violationCode: AWS_LZA_IDENTITY_CENTER_ASSIGNMENT_FORMAT_INVALID
      violationMessage: Identity Center assignments must use
        Principal:PermissionSet:Account format.
    - key: identity-assignment-permission-set-1
      label: Identity Center assignment references approved permission set
