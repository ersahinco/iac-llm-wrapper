      violationMessage: Centralized logging requires a log archive account.
    - key: centralized-logging-audit-account
      label: Centralized logging has audit account
      expression:
        applies_when:
          equals:
            decision: centralized_logging
            value: true
        present:
          decision: audit_account
      status: pass
      evidence: centralized_logging=True; audit_account=Audit
      violationCode: AWS_LZA_AUDIT_ACCOUNT_REQUIRED
      violationMessage: Centralized logging requires an audit account.
    - key: security-tooling-account-present
      label: Security tooling account exists
      expression:
        present:
          decision: security_tooling_account
      status: pass
      evidence: security_tooling_account=SecurityTooling
      violationCode: AWS_LZA_SECURITY_TOOLING_ACCOUNT_REQUIRED
      violationMessage: AWS LZA handoff requires a security tooling account.
    - key: identity-admin-known-account
      label: Identity Center delegated admin is known
      expression:
        references_known:
          source: identity_center_delegated_admin_account
          target: accounts.name
      status: pass
      evidence: delegated_admin=SecurityTooling; accounts=['Audit',
        'LogArchive', 'Management', 'Network', 'Prod', 'SecurityTooling']
      violationCode: AWS_LZA_IDENTITY_CENTER_ADMIN_UNKNOWN
      violationMessage: Identity Center delegated administrator must reference a
        known account.
    - key: identity-admin-security-ou
      label: Identity Center delegated admin belongs to Security OU
      expression:
        references_entity:
          source: identity_center_delegated_admin_account
          relationship: belongs_to
          target:
            kind: OU
            name: Security
      status: pass
      evidence: delegated_admin=SecurityTooling; ou=Security
      violationCode: AWS_LZA_IDENTITY_CENTER_ADMIN_SECURITY_OU_REQUIRED
      violationMessage: Identity Center delegated administrator must belong to
        the Security OU.
    - key: home-region-enabled
      label: Home region is enabled
      expression:
        contains:
          decision: enabled_regions
          value_from: home_region
      status: pass
      evidence: home_region=eu-central-1; enabled_regions=['eu-central-1']
      violationCode: AWS_LZA_HOME_REGION_NOT_ENABLED
      violationMessage: Home region must be present in enabled regions.
    - key: network-cidr-valid
      label: Network CIDR is valid
      expression:
        cidr_valid:
          decision: network_cidr
      status: pass
      evidence: network_cidr=10.0.0.0/16
      violationCode: AWS_LZA_NETWORK_CIDR_INVALID
      violationMessage: Network CIDR must be a valid IPv4 or IPv6 network.
    - key: identity-assignment-format-1
      label: Identity Center assignment has Principal:PermissionSet:Account
