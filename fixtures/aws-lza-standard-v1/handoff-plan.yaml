# yaml-language-server: $schema=none
# Generated by intent-engine — intent artifact, not deployable configuration.
pattern: aws-lza
boundary: iac-llm-wrapper emits validated handoff artifacts only; downstream
  generation, execution, dashboards, and cloud changes remain outside this
  artifact.
allowedNextAction: Pass the reviewed artifacts to the existing target toolchain
  after manual gates.
readiness:
  status: ready
  deploymentAllowed: true
  blockers: []
targetContracts:
  - name: aws-lza-sample-configuration
    kind: aws-lza-sample-configuration
    sourceUrl:
      https://awslabs.github.io/landing-zone-accelerator-on-aws/latest/sample-configurations/
    requiredArtifacts:
      - accounts-config.yaml
      - global-config.yaml
      - iam-config.yaml
      - network-config.yaml
      - organization-config.yaml
      - security-config.yaml
      - decision-report.yaml
      - lineage-manifest.yaml
      - deployment-runbook.md
steps:
  - id: resolve-decisions
    title: Confirm captured decisions and blockers
    owner: architecture-owner
    dependsOn: []
    manualGate: true
    rollback: Update the design document or interview answers and re-run
      compile.
  - id: validate-target-contracts
    title: Validate required artifacts against target contracts
    owner: platform-owner
    dependsOn:
      - resolve-decisions
    manualGate: true
    rollback: Stop handoff until contract validation is clean.
  - id: review-accounts-config-yaml
    title: Review accounts-config.yaml
    owner: platform-owner
    dependsOn:
      - validate-target-contracts
    manualGate: true
    rollback: Reject the handoff, correct the source intent, and re-run compile.
  - id: review-global-config-yaml
    title: Review global-config.yaml
    owner: platform-owner
    dependsOn:
      - validate-target-contracts
    manualGate: true
    rollback: Reject the handoff, correct the source intent, and re-run compile.
  - id: review-iam-config-yaml
    title: Review iam-config.yaml
    owner: security-owner
    dependsOn:
      - validate-target-contracts
    manualGate: true
    rollback: Reject the handoff, correct the source intent, and re-run compile.
  - id: review-network-config-yaml
    title: Review network-config.yaml
    owner: network-owner
    dependsOn:
      - validate-target-contracts
    manualGate: true
    rollback: Reject the handoff, correct the source intent, and re-run compile.
  - id: review-organization-config-yaml
    title: Review organization-config.yaml
    owner: platform-owner
    dependsOn:
      - validate-target-contracts
    manualGate: true
    rollback: Reject the handoff, correct the source intent, and re-run compile.
  - id: review-security-config-yaml
    title: Review security-config.yaml
    owner: security-owner
    dependsOn:
      - validate-target-contracts
    manualGate: true
    rollback: Reject the handoff, correct the source intent, and re-run compile.
  - id: review-decision-report-yaml
    title: Review decision-report.yaml
    owner: target-owner
    dependsOn:
      - validate-target-contracts
    manualGate: true
    rollback: Reject the handoff, correct the source intent, and re-run compile.
  - id: review-lineage-manifest-yaml
    title: Review lineage-manifest.yaml
    owner: target-owner
    dependsOn:
      - validate-target-contracts
    manualGate: true
    rollback: Reject the handoff, correct the source intent, and re-run compile.
  - id: review-deployment-runbook-md
    title: Review deployment-runbook.md
    owner: target-owner
    dependsOn:
      - validate-target-contracts
    manualGate: true
    rollback: Reject the handoff, correct the source intent, and re-run compile.
  - id: approve-handoff
    title: Approve handoff to existing provisioning toolchain
    owner: release-owner
    dependsOn:
      - review-accounts-config-yaml
      - review-global-config-yaml
      - review-iam-config-yaml
      - review-network-config-yaml
      - review-organization-config-yaml
      - review-security-config-yaml
      - review-decision-report-yaml
      - review-lineage-manifest-yaml
      - review-deployment-runbook-md
    manualGate: true
    rollback: Keep the previous approved artifact bundle as the active handoff.
manualGates:
  - No blocking gaps or contradictions remain.
  - Target contract validation is clean.
  - Artifact owners approve files in their domain.
  - Rollback owner and previous known-good handoff are identified.
rollback:
  - Do not mutate downstream systems from this plan.
  - Revert to the previous approved handoff bundle in the target toolchain.
  - Regenerate artifacts only from corrected intent.
