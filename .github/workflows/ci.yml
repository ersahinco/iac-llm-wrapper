name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra graphrag

      - name: Lint
        run: uv run --locked --extra dev --extra graphrag ruff check .

      - name: Type check
        run: uv run --locked --extra dev --extra graphrag mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra graphrag

      - name: Install and check OPA
        if: matrix.python-version == '3.11'
        run: |
          curl --fail --location --retry 3 https://github.com/open-policy-agent/opa/releases/download/v1.21.0/opa_linux_amd64_static -o /tmp/opa_linux_amd64_static
          echo '5eef70644868bb04d0556bcc795ee42f2ab379e73f51d1bfa30f83e1305bc9b9  /tmp/opa_linux_amd64_static' | sha256sum --check
          sudo install -m 755 /tmp/opa_linux_amd64_static /usr/local/bin/opa
          opa check --strict src/intent_engine/policy
          opa fmt --fail --list src/intent_engine/policy

      - name: Test
        run: uv run --locked --extra dev --extra graphrag pytest -v --tb=short

  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26.4-community
        env:
          NEO4J_AUTH: neo4j/cipassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p cipassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra graphrag

      - name: Graph tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: cipassword
        run: uv run --locked --extra dev --extra graphrag pytest tests/test_graph.py -v

      - name: End-to-end journey
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: cipassword
        run: |
          uv run --locked --extra dev --extra graphrag iac-llm-wrapper ingest samples/banking-packet.md
          uv run --locked --extra dev --extra graphrag iac-llm-wrapper review
          uv run --locked --extra dev --extra graphrag iac-llm-wrapper emit --out build/lza
          test -f build/lza/accounts-config.yaml
