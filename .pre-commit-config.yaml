repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --extra dev mypy
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run --extra dev pyright .
        language: system
        pass_filenames: false
      - id: sample-fixture-drift
        name: sample fixture drift
        entry: uv run python scripts/sync-sample-fixtures.py --check
        language: system
        pass_filenames: false
