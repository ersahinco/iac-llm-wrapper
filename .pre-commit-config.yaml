repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --extra dev ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --locked --extra dev mypy
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run --locked --extra dev pyright .
        language: system
        pass_filenames: false
      - id: sample-fixture-drift
        name: sample fixture drift
        entry: uv run --locked --extra dev python scripts/sync-sample-fixtures.py --check
        language: system
        pass_filenames: false
